name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env file is committed
        run: |
          # Secrets belong in Coolify's env var UI, never in the repo or image.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is committed. Remove it, rotate every value in it, and add it to .gitignore."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Coolify
        run: |
          curl --request POST '${{ secrets.COOLIFY_WEBHOOK }}' --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
      #- name: Trigger Coolify redeploy
        #env:
          #WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        #run: |
          #if [[ -z "$WEBHOOK" ]]; then
            #echo "COOLIFY_WEBHOOK secret not set — image pushed, but nothing was redeployed."
            #echo "Add it under Settings -> Secrets and variables -> Actions."
            #exit 0
          #fi
          #curl -fsSL --retry 3 --max-time 60 "$WEBHOOK"

      - name: Summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
